<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1739">
<title>JLPT N3 Vocabulary বাংলা | আপনার নিহোন</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f7fb;color:#17203c;font-family:"Noto Sans Bengali",system-ui,sans-serif;display:grid;place-items:center}.loading{width:min(430px,calc(100% - 32px));padding:28px;border:1px solid #e2e7ef;border-radius:24px;background:#fff;box-shadow:0 18px 52px rgba(25,38,78,.1);text-align:center}.mark{width:62px;height:62px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(145deg,#0b1739,#263b73);color:#b8f34a;display:grid;place-items:center;font-weight:900;font-size:24px}.loading b{font-size:18px}.loading p{margin:7px 0 0;color:#687188;font-size:13px}.bar{height:7px;margin-top:18px;border-radius:99px;background:#edf1f6;overflow:hidden}.bar:before{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:#25c590;animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(135%)}}.error{color:#b4233a}
</style>
</head>
<body>
<div class="loading" id="loader"><div class="mark">語</div><b>N3 Vocabulary লোড হচ্ছে…</b><p>পুরো ১,৩৪৫ শব্দ প্রস্তুত করা হচ্ছে।</p><div class="bar"></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('/n3-vocabulary-content.html?v=20260824',{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    let html=await response.text();
    if(!html.includes('data-vocab-row')) throw new Error('Vocabulary source invalid');
    html=html.replace('</head>','<link rel="stylesheet" href="/n3-vocabulary-all.css?v=5">\n</head>');
    const enhancement='<script src="/n3-vocabulary-examples.js?v=1"></scr'+'ipt>\n<script src="/n3-vocabulary-all.js?v=5"></scr'+'ipt>\n</body>';
    html=html.replace('</body>',enhancement);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    const el=document.getElementById('loader');
    if(el) el.innerHTML='<div class="mark">!</div><b class="error">Vocabulary load করা যায়নি</b><p>Internet connection check করে আবার reload করুন।</p>';
  }
})();
</script>
</body>
</html>
