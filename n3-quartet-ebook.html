<!doctype html>
<html lang="bn" dir="ltr" data-language-preset="bn" data-source-language="bn">
<head>
  <script id="legacy-origin-redirect">
  (function(){
    var h = location.hostname;
    if (h !== "sammir03-bot.github.io" && h !== "aponar-nihon.eu.cc") return;
    var p = location.pathname || "/";
    if (h === "sammir03-bot.github.io") {
      var bases = ["/Aponar-Nihon-", "/Aponar-Nihon"];
      for (var i = 0; i < bases.length; i++) {
        var base = bases[i];
        if (p === base || p === base + "/") { p = "/"; break; }
        if (p.indexOf(base + "/") === 0) { p = p.slice(base.length) || "/"; break; }
      }
    }
    if (p === "/index.html") p = "/";
    else if (p.endsWith("/index.html")) p = p.slice(0, -10);
    else if (p.endsWith(".html")) p = p.slice(0, -5);
    location.replace("https://app.aponar-nihon.workers.dev" + p + location.search + location.hash);
  })();
  </script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>QUARTET I বাংলা Interactive eBook | আপনার নিহোন</title>
<link rel="icon" href="/logo.png" type="image/png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Noto Sans Bengali","Noto Sans JP",sans-serif;background:#071426;color:#edf5ff}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);border:1px solid #244b72;border-radius:20px;background:#0d213a;padding:28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}.logo{width:62px;height:62px;border-radius:16px;margin-bottom:12px}.loader{height:8px;background:#16324f;border-radius:999px;overflow:hidden;margin:22px 0}.bar{height:100%;width:28%;background:linear-gradient(90deg,#3aa9ff,#8c5cff);border-radius:inherit;animation:move 1.1s infinite ease-in-out}@keyframes move{0%{transform:translateX(-120%)}100%{transform:translateX(420%)}}a{color:#7fc5ff}.error{display:none}.back{display:inline-block;margin-top:12px;text-decoration:none;padding:10px 14px;border:1px solid #244b72;border-radius:12px;background:#102744;color:#fff}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<img class="logo" src="/logo.png" alt="আপনার নিহোন">
<h1>QUARTET I বাংলা eBook</h1>
<p id="status">১৩৫ পৃষ্ঠার Interactive Reader প্রস্তুত হচ্ছে…</p>
<div class="loader" id="loader"><div class="bar"></div></div>
<div class="error" id="error"><p>Reader load করা যায়নি।</p><p>QUARTET I-এর গ্রামার সহায়িকা পড়তে পারেন।</p><a class="back" href="/n3-quartet-grammar.html">৫৫টি গ্রামার পাঠ খুলুন →</a><a class="back" href="/n3.html#course">← N3 Learning Center-এ ফিরুন</a></div>
</div></div>
<script>
(async()=>{
 const status=document.getElementById('status'),loader=document.getElementById('loader'),error=document.getElementById('error');
 try{
   if(!('DecompressionStream' in window)) throw new Error('Browser gzip support unavailable');
   const base='/assets/ebook/quartet-i-bn/';
   const urls=Array.from({length:8},(_,i)=>base+'chunk-'+String(i+1).padStart(2,'0')+'.txt');
   let b64='';
   for(let i=0;i<urls.length;i++){
     status.textContent='eBook load হচ্ছে… '+Math.round((i/urls.length)*100)+'%';
     const r=await fetch(urls[i],{cache:'force-cache'});
     if(!r.ok) throw new Error('Chunk '+(i+1));
     b64+=(await r.text()).trim();
   }
   status.textContent='Reader খুলছে…';
   const raw=atob(b64),bytes=new Uint8Array(raw.length);
   for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const bookHtml=await new Response(stream).text();
   document.open();document.write(bookHtml);document.close();
 }catch(e){
   console.error(e);status.textContent='eBook load করতে সমস্যা হয়েছে।';loader.style.display='none';error.style.display='block';
 }
})();
</script>
</body>
</html>
