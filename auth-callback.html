<!doctype html>
<html lang="bn" dir="ltr" data-language-preset="bn" data-source-language="bn">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#126eae">
  <title>Email Verification | Aponar Nihon</title><link rel="icon" href="/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+Bengali:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 12% 0%,rgba(65,153,225,.15),transparent 34%),linear-gradient(155deg,#edf7ff,#f8fbff);font-family:'Noto Sans Bengali','Inter',sans-serif;color:#173b5e}.card{width:min(460px,100%);background:rgba(255,255,255,.98);border:1px solid #dceaf4;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 24px 70px rgba(18,78,122,.14)}.logo{width:66px;height:66px;object-fit:contain}.icon{width:70px;height:70px;border-radius:22px;margin:16px auto 12px;display:grid;place-items:center;background:#eaf7f2;color:#08745b;font-size:32px;font-weight:900}.icon.bad{background:#fff0f1;color:#a9434a}.title{font-size:22px;font-weight:900;margin:0}.text{font-size:12px;color:#6f8497;line-height:1.7;margin:9px auto 0;max-width:360px}.spinner{width:28px;height:28px;border:3px solid #dbeaf4;border-top-color:#176fa8;border-radius:50%;margin:18px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.actions{display:none;gap:9px;margin-top:17px}.actions.show{display:grid}.btn{min-height:47px;padding:10px 14px;border-radius:14px;border:0;background:#176fa8;color:#fff;text-decoration:none;display:grid;place-items:center;font-weight:900;font-size:12px}.btn.alt{background:#f2f7fb;color:#176fa8;border:1px solid #dce8f1}.hint{display:none;margin:13px 0 0;padding:10px 12px;border-radius:13px;background:#fff8e8;color:#8d6419;font-size:10px;font-weight:700;line-height:1.55}.hint.show{display:block}@media(max-width:420px){.card{padding:24px 17px;border-radius:24px}.title{font-size:20px}}</style>
  <script id="legacy-origin-redirect">
  (function(){
    var h=location.hostname;
    if(h!=="sammir03-bot.github.io"&&h!=="aponar-nihon.eu.cc")return;
    var p=location.pathname||"/";
    if(h==="sammir03-bot.github.io"){
      var bases=["/Aponar-Nihon-","/Aponar-Nihon"];
      for(var i=0;i<bases.length;i++){var base=bases[i];if(p===base||p===base+"/"){p="/";break}if(p.indexOf(base+"/")===0){p=p.slice(base.length)||"/";break}}
    }
    if(p==="/index.html")p="/";else if(p.endsWith("/index.html"))p=p.slice(0,-10);else if(p.endsWith(".html"))p=p.slice(0,-5);
    location.replace("https://app.aponar-nihon.workers.dev"+p+location.search+location.hash);
  })();
  </script>
</head>
<body><main class="card"><img class="logo" src="/logo.png" alt="Aponar Nihon"><div id="icon" class="icon">✓</div><h1 id="title" class="title">Email verify করা হচ্ছে...</h1><div id="spinner" class="spinner"></div><p id="text" class="text">Verification link নিরাপদভাবে যাচাই করছি।</p><p id="hint" class="hint">একই verification link সাধারণত একবারই ব্যবহার করা যায়। Link expire হলে নতুন verification email পাঠান।</p><div id="actions" class="actions"><a class="btn" href="/auth.html#register">Login / Register-এ ফিরুন</a><a class="btn alt" href="/">হোমে যান</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/account.js?v=20260907-1"></script>
<script>
(async()=>{const title=document.getElementById('title'),text=document.getElementById('text'),spinner=document.getElementById('spinner'),icon=document.getElementById('icon'),actions=document.getElementById('actions'),hint=document.getElementById('hint');try{const result=await AN.completeAuthRedirect();title.textContent='Email verification সফল হয়েছে';text.textContent='আপনার account verify হয়েছে। Profile খুলছে...';spinner.style.display='none';icon.textContent='✓';setTimeout(()=>location.replace(result.next||'/profile.html?verified=1'),500)}catch(err){spinner.style.display='none';icon.classList.add('bad');icon.textContent='!';title.textContent='Verification complete করা যায়নি';const s=(err?.message||'').toLowerCase();text.textContent=(s.includes('expire')||s.includes('invalid')||s.includes('otp')||s.includes('token'))?'Linkটি invalid, expire অথবা আগে ব্যবহার করা হয়েছে। নতুন verification email পাঠিয়ে আবার চেষ্টা করুন।':(err?.message||'Verification complete করা যায়নি। নতুন link দিয়ে আবার চেষ্টা করুন।');hint.classList.add('show');actions.classList.add('show')}})();
</script></body></html>
