<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#126eae"><title>Reset Password | Aponar Nihon</title><link rel="icon" href="/logo.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+Bengali:wght@500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(155deg,#edf7ff,#f8fbff);font-family:'Noto Sans Bengali','Inter',sans-serif;color:#173b5e}.card{width:min(440px,100%);background:#fff;border:1px solid #dceaf4;border-radius:28px;padding:26px 22px;box-shadow:0 24px 70px rgba(18,78,122,.14)}.brand{text-align:center}.brand img{width:62px}.brand h1{margin:9px 0 4px;font-size:22px}.brand p{margin:0 0 18px;color:#758b9d;font-size:11px;line-height:1.6}.field{margin:11px 0}.field label{font-size:11px;font-weight:900;display:block;margin:0 0 6px 2px}.input{width:100%;height:50px;border:1px solid #d7e3ec;border-radius:14px;padding:0 14px;font-size:14px;outline:none}.input:focus{border-color:#4c9bd0;box-shadow:0 0 0 4px rgba(42,135,197,.09)}.btn{width:100%;height:50px;border:0;border-radius:14px;background:#176fa8;color:#fff;font-weight:900;margin-top:8px}.btn:disabled{opacity:.6}.msg{display:none;margin-top:12px;padding:11px 12px;border-radius:12px;font-size:11px;line-height:1.55}.msg.good{display:block;background:#edfbf5;color:#197452}.msg.bad{display:block;background:#fff1f2;color:#a9434a}.back{display:block;text-align:center;margin-top:16px;color:#176fa8;text-decoration:none;font-size:11px;font-weight:900}</style></head>
<body><main class="card"><div class="brand"><img src="/logo.png" alt="Aponar Nihon"><h1>নতুন Password সেট করুন</h1><p>কমপক্ষে 8 অক্ষরের নতুন password দিন।</p></div><form id="form"><div class="field"><label for="p1">New Password</label><input class="input" id="p1" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="p2">Confirm Password</label><input class="input" id="p2" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn" id="btn" type="submit">Password Update করুন</button></form><div id="msg" class="msg" role="status"></div><a class="back" href="/auth.html">← Login page</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/account.js?v=20260904-1"></script><script>
const form=document.getElementById('form'),btn=document.getElementById('btn'),msg=document.getElementById('msg');function message(t,b=false){msg.className='msg '+(b?'bad':'good');msg.textContent=t}form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<8)return message('Password কমপক্ষে 8 অক্ষরের হতে হবে।',true);if(a!==b)return message('দুইটি password মিলছে না।',true);btn.disabled=true;btn.textContent='Update হচ্ছে...';try{if(!await AN.session())throw new Error('Reset session পাওয়া যায়নি। Email-এর নতুন reset link আবার খুলুন।');await AN.updatePassword(a);message('Password সফলভাবে পরিবর্তন হয়েছে। Profile খুলছে...');setTimeout(()=>location.replace('/profile.html'),650)}catch(err){message(err?.message||'Password update করা যায়নি।',true)}finally{btn.disabled=false;btn.textContent='Password Update করুন'}});(async()=>{try{if(!await AN.session())message('Reset linkটি invalid বা expire হয়েছে। Login page থেকে নতুন reset link নিন।',true)}catch(_){}})();
</script></body></html>
