name: Secure Pages Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - 'play-store/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply native Bangla default fix
        run: python .github/scripts/fix_bangla_default.py

      - name: Verify language startup
        run: |
          node --check assets/js/i18n.js
          node --check assets/js/i18n-content.js
          grep -F 'return languageFromPath() || storedLanguage() || DEFAULT_LANGUAGE;' assets/js/i18n.js
          grep -F 'if (!isHomeRoute()) return;' assets/js/i18n.js
          grep -F 'if (language === "bn") return false;' assets/js/i18n-content.js
          grep -F 'Bangla is already the source HTML' assets/js/i18n-content.js

      - name: Persist Bangla default source fix
        run: |
          if git diff --quiet -- assets/js/i18n.js assets/js/i18n-content.js; then
            echo "Bangla default source fix already present"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/js/i18n.js assets/js/i18n-content.js
            git commit -m "Make Bangla the instant default language"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build and verify static site
        run: npm run verify

      - name: Convert GitHub Pages to legacy redirects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import html

          root = Path('_site')
          production = 'https://app.aponar-nihon.workers.dev'

          def clean_target(page: Path) -> str:
              rel = page.relative_to(root).as_posix()
              if rel == 'index.html':
                  path = '/'
              elif rel.endswith('/index.html'):
                  path = '/' + rel[:-len('index.html')]
              elif rel.endswith('.html'):
                  path = '/' + rel[:-5]
              else:
                  path = '/' + rel
              return production + quote(path, safe='/-._~')

          def redirect_document(target: str) -> str:
              escaped = html.escape(target, quote=True)
              js_target = target.replace('\\', '\\\\').replace('"', '\\"')
              return f'''<!doctype html>
          <html lang="bn">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <title>Aponar Nihon moved</title>
            <link rel="canonical" href="{escaped}">
            <meta http-equiv="refresh" content="0; url={escaped}">
            <script>location.replace("{js_target}" + location.search + location.hash);</script>
          </head>
          <body>
            <p>Aponar Nihon নতুন ঠিকানায় চলে গেছে।</p>
            <p><a href="{escaped}">নতুন সাইট খুলুন</a></p>
          </body>
          </html>
          '''

          for page in root.rglob('*.html'):
              if page.name == '404.html' and page.parent == root:
                  continue
              page.write_text(redirect_document(clean_target(page)), encoding='utf-8')

          (root / '404.html').write_text('''<!doctype html>
          <html lang="bn">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <title>Aponar Nihon moved</title>
            <link rel="canonical" href="https://app.aponar-nihon.workers.dev/">
            <meta http-equiv="refresh" content="0; url=https://app.aponar-nihon.workers.dev/">
            <script>
            (function(){
              var p = location.pathname || '/';
              var bases = ['/Aponar-Nihon-', '/Aponar-Nihon'];
              for (var i = 0; i < bases.length; i++) {
                var base = bases[i];
                if (p === base || p === base + '/') { p = '/'; break; }
                if (p.indexOf(base + '/') === 0) { p = p.slice(base.length) || '/'; break; }
              }
              if (p === '/index.html') p = '/';
              else if (p.endsWith('/index.html')) p = p.slice(0, -10);
              else if (p.endsWith('.html')) p = p.slice(0, -5);
              location.replace('https://app.aponar-nihon.workers.dev' + p + location.search + location.hash);
            })();
            </script>
          </head>
          <body>
            <p>Aponar Nihon নতুন ঠিকানায় চলে গেছে।</p>
            <p><a href="https://app.aponar-nihon.workers.dev/">নতুন সাইট খুলুন</a></p>
          </body>
          </html>
          ''', encoding='utf-8')

          (root / 'robots.txt').write_text(
              'User-agent: *\nAllow: /\nSitemap: https://app.aponar-nihon.workers.dev/sitemap.xml\n',
              encoding='utf-8',
          )

          cname = root / 'CNAME'
          if cname.exists():
              cname.unlink()
          PY

      - name: Verify legacy redirect output
        run: |
          grep -F 'https://app.aponar-nihon.workers.dev/' _site/index.html
          grep -F 'http-equiv="refresh"' _site/index.html
          grep -F 'name="robots" content="noindex,follow"' _site/index.html
          grep -F 'location.replace' _site/index.html
          test ! -e _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
