name: Secure Pages Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - 'play-store/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build and verify static site
        run: npm run verify

      - name: Publish private Google Maps key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          test -n "$GOOGLE_MAPS_API_KEY" || { echo "GOOGLE_MAPS_API_KEY secret is missing"; exit 1; }
          python3 - <<'PY'
          import json, os, pathlib
          from urllib.parse import urlparse, parse_qs

          raw = os.environ['GOOGLE_MAPS_API_KEY'].strip()
          key = raw
          if raw.startswith(('http://', 'https://')):
              key = parse_qs(urlparse(raw).query).get('key', [''])[0].strip()

          if not key.startswith('AIza'):
              raise SystemExit('GOOGLE_MAPS_API_KEY must be a Google Maps browser key or a Maps JS URL containing ?key=...')

          pathlib.Path('_site/google-maps-config.js').write_text(
              'window.AN_GOOGLE_MAPS_KEY = ' + json.dumps(key) + ';\n',
              encoding='utf-8'
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
