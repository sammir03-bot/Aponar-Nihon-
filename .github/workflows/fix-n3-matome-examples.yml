name: Fix N3 Matome examples

on:
  push:
    branches:
      - "fix/n3-matome-examples-20260910"
    paths:
      - ".github/n3-examples-fix-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/fix_n3_examples.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add n3-matome-grammar.html assets/css/n3-matome.css
          git diff --cached --quiet || git commit -m "fix: N3 example cards and furigana"
          git push
