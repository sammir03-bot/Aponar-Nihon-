name: Native Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --clean --no-install --platform android

      - name: Build standalone ARM64 release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify standalone JS bundle exists
        run: |
          test -f mobile/android/app/build/generated/assets/createBundleReleaseJsAndAssets/index.android.bundle || test -f mobile/android/app/build/intermediates/assets/release/mergeReleaseAssets/index.android.bundle

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk Aponar-Nihon-Standalone-Android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aponar-Nihon-Standalone-Android-arm64
          path: Aponar-Nihon-Standalone-Android-arm64.apk
          if-no-files-found: error
          retention-days: 7
