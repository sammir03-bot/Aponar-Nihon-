name: Temporary APKPure Signing Bootstrap

on:
  push:
    branches: ['chatgpt/full-app-parity-20260928']
    paths:
      - '.github/workflows/temporary-apkpure-key-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap-signing-key:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate mobile source
        run: |
          npm run typecheck
          npm run doctor

      - name: Read release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app.json').expo.version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          PACKAGE_NAME="$(node -p "require('./app.json').expo.android.package")"
          test "$PACKAGE_NAME" = "com.aponarnihon.app"
          printf 'RELEASE_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'RELEASE_VERSION_CODE=%s\n' "$VERSION_CODE" >> "$GITHUB_ENV"
          printf 'RELEASE_PACKAGE=%s\n' "$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "Bootstrap release: $PACKAGE_NAME $VERSION ($VERSION_CODE)"

      - name: Generate Android project
        run: npm run prebuild:android -- --no-install

      - name: Build optimized release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Generate permanent release signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/signing-private
          SIGNING_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          printf 'SIGNING_PASSWORD=%s\n' "$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          keytool -genkeypair \
            -keystore dist/signing-private/Aponar-Nihon-release-key.jks \
            -storetype PKCS12 \
            -alias aponarnihon \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -dname 'CN=Aponar Nihon, OU=Android Release, O=Aponar Nihon, C=JP'

          cat > dist/signing-private/Aponar-Nihon-signing-credentials.txt <<EOF
          Aponar Nihon permanent Android release signing credentials

          Keystore file: Aponar-Nihon-release-key.jks
          Alias: aponarnihon
          Store password: $SIGNING_PASSWORD
          Key password: $SIGNING_PASSWORD
          Package: $RELEASE_PACKAGE
          First release with this key: $RELEASE_VERSION
          First version code with this key: $RELEASE_VERSION_CODE

          IMPORTANT: Keep this keystore and credentials permanently. Every future APKPure release must use this exact key.
          EOF

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$UNSIGNED_APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          mkdir -p dist

          ALIGNED_APK="dist/Aponar-Nihon-v${RELEASE_VERSION}-APKPure-aligned.apk"
          FINAL_APK="dist/Aponar-Nihon-v${RELEASE_VERSION}-APKPure.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks dist/signing-private/Aponar-Nihon-release-key.jks \
            --ks-key-alias aponarnihon \
            --ks-pass env:SIGNING_PASSWORD \
            --key-pass env:SIGNING_PASSWORD \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK" | tee dist/signature-verification.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL_APK" >/dev/null
          sha256sum "$FINAL_APK" > "${FINAL_APK}.sha256"
          rm -f "$ALIGNED_APK"

      - name: Encrypt permanent signing backup for handoff
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/aponar-nihon-transport-cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIERTCCAq2gAwIBAgIUSdKmUHx15/awoeNygMxbblnbbiQwDQYJKoZIhvcNAQEL
          BQAwMjEwMC4GA1UEAwwnQXBvbmFyIE5paG9uIFNpZ25pbmcgUmVjb3ZlcnkgVHJh
          bnNwb3J0MB4XDTI2MDkyOTAyMDk1MVoXDTI2MTAyOTAyMDk1MVowMjEwMC4GA1UE
          AwwnQXBvbmFyIE5paG9uIFNpZ25pbmcgUmVjb3ZlcnkgVHJhbnNwb3J0MIIBojAN
          BgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAnW8iv1Cl05rkuN/LJbERLE6+5+f3
          vcu+RHo8FDzuNFi6oNc9BMfAT8NXMYluZlTtJHOaewMaGuNKnl24PVrlBxslkkhI
          jJjsZ+lRRyCOoaQygSDbg27vOXWuuzSomERIV0T8jpSIaMoq7Niwd0WIQ+Z7Necc
          rnWbMsvEbBH5wHo9iG8K9wp9AtdZyvDR9izfemlM/SqNGJ2DXqAKlm7viipsZHpa
          nNj7X6D2xOyvV7/Fw4wi3UyDEvbh14sSPX3CCstzkQ3elfTorOP4yUtWaumLfMho
          MZMp2q6AJ5H6D9kd7YZOKwo3W1qiRD31QIUxGzw/74NzfhmPYNfpaGRzxslfJCwY
          TUV0Ce5Are2oX08oc8MP9OofJUAkWiioMr7GIs/3L+x27v5XbvKLWprSDcje6Zpo
          cR6ZPVPIFA1uesxtpVU0O0kU0Dh1s0Oud/95tssXgY6rgVdn7N59LJxqEP1Gyz6a
          nglJHe3hoT8gv3RlgLniI9IFDXmlQ67W+NshAgMBAAGjUzBRMB0GA1UdDgQWBBQl
          JWjgz69DfzNEecpAKyNdDemVbzAfBgNVHSMEGDAWgBQlJWjgz69DfzNEecpAKyNd
          DemVbzAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBgQArCzUcxnkV
          om4AeMJ6jn/wa73quIq7wFyKY7H0TRtTIY64KRoougFlFT6YW29E5q5Etkm7B5KS
          hqVknoFRbyne7cfVkzJ0FslEUordZoSUUXF96Ayre550+5/oZoyubgIhXuLrGFLT
          tKHoTeaJ8joixYPQ8hfpDkFrF2ZMzrWz9sx+aR5kSfs11hG+1frOb2yvj+zNQs5k
          AlJMjhW3iL7gzPD9lvBXPWSLplUX8NkBYJ4Tkl4B//JqYLHLyL2xJIjLfKUEPtqC
          Hh/ulYTAjxXl+dCYMC764vI1/HT+9ZuM+DlGWdi/CFLhpTnK8G91tLrQTJHZqCXb
          n+o5vZLiJlxpQI9JqORVnRRg+S5tmkcmEqjLaB+WXmZP75bfl4xcy4BXwGE5oSiI
          NxouwPXSZXOnYA62YUSwYD8yzgeVHMl2Z0jzPMCm386fP09dh9KARMdMVQ5jDOxv
          z2ANyzZCXxWu0Ae44jFQR/nXsu17fsBi5NrQWd7vPe6CIg4UbQGs5/M=
          -----END CERTIFICATE-----
          CERT

          (cd dist/signing-private && zip -q ../Aponar-Nihon-permanent-signing-backup.zip Aponar-Nihon-release-key.jks Aponar-Nihon-signing-credentials.txt)
          openssl cms -encrypt -binary -aes256 \
            -in dist/Aponar-Nihon-permanent-signing-backup.zip \
            -out dist/Aponar-Nihon-permanent-signing-backup.cms \
            -outform DER \
            /tmp/aponar-nihon-transport-cert.pem
          rm -rf dist/signing-private dist/Aponar-Nihon-permanent-signing-backup.zip /tmp/aponar-nihon-transport-cert.pem

      - name: Upload bootstrap release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Aponar-Nihon-APKPure-bootstrap-v${{ env.RELEASE_VERSION }}
          path: |
            mobile/dist/Aponar-Nihon-v${{ env.RELEASE_VERSION }}-APKPure.apk
            mobile/dist/Aponar-Nihon-v${{ env.RELEASE_VERSION }}-APKPure.apk.sha256
            mobile/dist/signature-verification.txt
            mobile/dist/Aponar-Nihon-permanent-signing-backup.cms
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
