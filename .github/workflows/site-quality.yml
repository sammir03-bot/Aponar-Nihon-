name: Site Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Protect existing source content
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/compare_visible_content.py --base origin/main
          else
            python3 tools/compare_visible_content.py --base HEAD^
          fi

      - name: Build and verify with Python + Node.js
        run: npm run verify

      - name: Verify generated professional and SEO assets
        run: |
          test -s _site/assets/css/pro-core.css
          test -s _site/assets/js/pro-core.js
          test -s _site/assets/js/ts/platform.js
          test -s _site/assets/data/search-index.json
          test -s _site/assets/data/site-audit.json
          test -s _site/_headers
          test -s _site/robots.txt
          test -s _site/sitemap.xml
          grep -Fq 'Sitemap: https://app.aponar-nihon.workers.dev/sitemap.xml' _site/robots.txt
          grep -Fq '<loc>https://app.aponar-nihon.workers.dev/</loc>' _site/sitemap.xml
          grep -Fq '<link rel="canonical" href="https://app.aponar-nihon.workers.dev/">' _site/index.html
