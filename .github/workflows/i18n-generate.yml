name: Full multilingual AI draft and review

on:
  push:
    branches:
      - feat/full-static-i18n
    paths:
      - tools/i18n-run-request.txt
  workflow_dispatch:
    inputs:
      confirm_paid_usage:
        description: I approve Workers AI paid usage for this bounded translation job
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: full-static-i18n-generation
  cancel-in-progress: false

jobs:
  translate:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.confirm_paid_usage == true) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[run paid i18n]'))
      }}
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 360

    steps:
      - name: Checkout translation branch
        uses: actions/checkout@v7
        with:
          ref: feat/full-static-i18n
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate translation code before paid inference
        run: |
          python3 -m py_compile tools/i18n_ai_pipeline.py
          python3 -m unittest tests/test_i18n_ai_pipeline.py -v
          npx --yes wrangler@4 deploy --dry-run --config tools/i18n-worker/wrangler.toml

      - name: Create temporary job credential
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "APONAR_I18N_JOB_TOKEN=$token" >> "$GITHUB_ENV"
          echo "APONAR_I18N_WORKER_URL=https://aponar-nihon-i18n-job.aponar-nihon.workers.dev" >> "$GITHUB_ENV"

      - name: Deploy temporary translation Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config tools/i18n-worker/wrangler.toml

      - name: Protect temporary translation Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$APONAR_I18N_JOB_TOKEN" | npx --yes wrangler@4 secret put I18N_JOB_TOKEN --config tools/i18n-worker/wrangler.toml

      - name: Confirm temporary Worker health
        run: |
          sleep 5
          curl --fail --silent --show-error "$APONAR_I18N_WORKER_URL/health"

      - name: Generate resumable reviewed memories
        shell: bash
        run: |
          set +e
          final_status=0
          for language in ja en vi ne hi ur my zh si fil; do
            python3 tools/i18n_ai_pipeline.py \
              --language "$language" \
              --output "translations/$language.json"
            language_status=$?

            if test -f "translations/$language.json"; then
              git add "translations/$language.json"
              if ! git diff --cached --quiet; then
                git config user.name "Aponar Nihon Translation Bot"
                git config user.email "actions@users.noreply.github.com"
                git commit -m "i18n: checkpoint reviewed $language memory [skip i18n-generate]"
                git push origin HEAD:feat/full-static-i18n
              fi
            fi

            if test "$language_status" -ne 0; then
              final_status="$language_status"
              break
            fi
          done
          exit "$final_status"

      - name: Validate complete multilingual catalog
        run: python3 tools/i18n_ai_pipeline.py --validate-dir translations

      - name: Delete temporary translation Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 delete --config tools/i18n-worker/wrangler.toml --force
