name: Apply inner section card system

on:
  push:
    branches:
      - feature/inner-section-card-system-20260912

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/inner-section-card-system-20260912
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply card system to section pages
        run: node scripts/apply-inner-section-card-system.mjs

      - name: Validate JavaScript and whitespace
        run: |
          node --check assets/js/inner-section-cards.js
          git diff --check
          if ! git diff --quiet -- index.html; then
            echo 'Home page index.html must remain unchanged.'
            git diff -- index.html
            exit 1
          fi

      - name: Commit generated page updates
        run: |
          if git diff --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/inner-section-cards.js *.html
          git commit -m 'Apply premium card layout to all inner section hubs'
          git push origin HEAD:feature/inner-section-card-system-20260912
