          PY
      - name: Commit Daily News data
        run: |
          if git diff --quiet -- assets/data/daily-news.json; then
            echo "No Daily News change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/daily-news.json
          git commit -m "Daily Japanese News 2026-09-11"
          git push origin HEAD:news/2026-09-11-auto
