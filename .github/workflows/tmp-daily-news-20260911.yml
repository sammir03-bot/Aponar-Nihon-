          existing_ids = {a.get('id') for a in data.get('articles', [])}
          if any(a['id'] in existing_ids for a in new_articles) or any(a.get('date') == '2026-09-11' for a in data.get('articles', [])):
              print('Today entries already exist; leaving file unchanged.')
              raise SystemExit(0)

          data['updated_at'] = '2026-09-11T08:12:00+09:00'
          data['articles'] = new_articles + data.get('articles', [])

          required = {'id','date','level','category_bn','headline','headline_tokens','teaser_bn','japanese','explanation_bn','vocabulary','source'}
          ids = set()
          for a in data['articles']:
              missing = required - set(a)
              assert not missing, (a.get('id'), missing)
              assert a['id'] not in ids, f"duplicate id: {a['id']}"
              ids.add(a['id'])
              assert a['level'] in {'N4','N3'}
              assert isinstance(a['headline_tokens'], list) and a['headline_tokens']
              assert isinstance(a['japanese'], list) and a['japanese']
              assert isinstance(a['explanation_bn'], list) and a['explanation_bn']
              assert isinstance(a['vocabulary'], list) and a['vocabulary']
              assert isinstance(a['source'], dict)
              assert {'name','url','published_at'} <= set(a['source'])
              for tok in a['headline_tokens']:
                  if isinstance(tok, dict):
                      assert isinstance(tok.get('t'), str) and isinstance(tok.get('r'), str)
              for sentence in a['japanese']:
                  assert isinstance(sentence, list)
                  for tok in sentence:
                      assert isinstance(tok, (str, int, float, dict))
                      if isinstance(tok, dict):
                          assert isinstance(tok.get('t'), str) and isinstance(tok.get('r'), str)
              for v in a['vocabulary']:
                  assert {'word','reading','meaning_bn'} <= set(v)

          out = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
