name: Daily News Verify Diagnostics

on:
  push:
    branches:
      - feature/daily-japanese-news

permissions:
  contents: read

jobs:
  verify-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Capture verify output
        id: verify
        shell: bash
        run: |
          set +e
          npm run verify 2>&1 | tee verify.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload verify log
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-verify-log
          path: verify.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail if verify failed
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
