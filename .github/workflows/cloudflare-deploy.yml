name: Cloudflare Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce native Bangla across the whole site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/force_native_bangla_site.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '        if any(part in EXCLUDED_DIRS for part in rel.parts):',
              '        if path.name.startswith("google") or any(part in EXCLUDED_DIRS for part in rel.parts):'
          )
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          python3 .github/scripts/force_native_bangla_site.py

      - name: Verify Bangla runtime guards
        run: |
          node --check assets/js/i18n.js
          node --check assets/js/i18n-content.js
          grep -F 'return languageFromPath() || DEFAULT_LANGUAGE;' assets/js/i18n.js
          grep -F 'if (language === "bn") return false;' assets/js/i18n-content.js
          grep -F 'if (window.AponarI18n.getLanguage() === "bn")' assets/js/i18n-content.js
          grep -F 'data-language-preset="bn"' index.html

      - name: Persist native Bangla normalization
        run: |
          if git diff --quiet; then
            echo "Native Bangla defaults already normalized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Make every native HTML page Bangla by default"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Build verified site
        run: npm run verify

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --keep-vars
