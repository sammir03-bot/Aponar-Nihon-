name: Cloudflare Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply native Bangla default fix
        run: python .github/scripts/fix_bangla_default.py

      - name: Verify language startup
        run: |
          node --check assets/js/i18n.js
          node --check assets/js/i18n-content.js
          grep -F 'return languageFromPath() || DEFAULT_LANGUAGE;' assets/js/i18n.js
          grep -F 'if (language === "bn") return false;' assets/js/i18n-content.js
          grep -F 'Bangla is already the source HTML' assets/js/i18n-content.js

      - name: Persist Bangla default fix
        run: |
          if git diff --quiet -- assets/js/i18n.js assets/js/i18n-content.js; then
            echo "Bangla default fix already present"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/js/i18n.js assets/js/i18n-content.js
            git commit -m "Make Bangla the instant default language"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Build verified site
        run: npm run verify

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --keep-vars