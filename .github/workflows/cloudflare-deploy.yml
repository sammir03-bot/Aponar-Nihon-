name: Cloudflare Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce native Bangla across the whole site
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Search Console verification HTML is a token file, not a user-facing page.
          p = Path('.github/scripts/force_native_bangla_site.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '        if any(part in EXCLUDED_DIRS for part in rel.parts):',
              '        if path.name.startswith("google") or any(part in EXCLUDED_DIRS for part in rel.parts):'
          )
          s = s.replace(
              '    for page in pages:\n        rel_path = page.relative_to(site)\n        if rel_path.parts and rel_path.parts[0] in SUPPORTED[1:]:',
              '    for page in pages:\n        if page.name.startswith("google"):\n            continue\n        rel_path = page.relative_to(site)\n        if rel_path.parts and rel_path.parts[0] in SUPPORTED[1:]:'
          )
          p.write_text(s, encoding='utf-8', newline='\n')

          # Repair the guard already written by the previous normalization run.
          p = Path('tools/check_i18n.py')
          s = p.read_text(encoding='utf-8')
          old = '    native_locale_errors: list[str] = []\n    for page in pages:\n        rel_path = page.relative_to(site)\n        if rel_path.parts and rel_path.parts[0] in SUPPORTED[1:]:\n            continue'
          new = '    native_locale_errors: list[str] = []\n    for page in pages:\n        if page.name.startswith("google"):\n            continue\n        rel_path = page.relative_to(site)\n        if rel_path.parts and rel_path.parts[0] in SUPPORTED[1:]:\n            continue'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          python3 .github/scripts/force_native_bangla_site.py

      - name: Verify Bangla runtime guards
        run: |
          node --check assets/js/i18n.js
          node --check assets/js/i18n-content.js
          grep -F 'return languageFromPath() || storedLanguage() || DEFAULT_LANGUAGE;' assets/js/i18n.js
          grep -F 'if (!isHomeRoute()) return;' assets/js/i18n.js
          grep -F 'if (language === "bn") return false;' assets/js/i18n-content.js
          grep -F 'if (window.AponarI18n.getLanguage() === "bn")' assets/js/i18n-content.js
          grep -F 'data-language-preset="bn"' index.html
          python3 - <<'PY'
          from pathlib import Path
          text = Path('tools/check_i18n.py').read_text(encoding='utf-8')
          assert 'native_locale_errors' in text
          block = text.split('native_locale_errors', 1)[1][:300]
          assert 'page.name.startswith("google")' in block
          PY

      - name: Integrate QUARTET eBook into N3 Grammar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('n3.html')
          s = p.read_text(encoding='utf-8')

          if 'data-track="quartet-ebook"' not in s:
              marker = 'data-track="matome"'
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('N3 Matome card not found')
              end = s.find('</a>', pos)
              if end < 0:
                  raise SystemExit('N3 Matome closing tag not found')
              end += len('</a>')
              card = '''
        <a class="lh-resource-card" data-track="quartet-ebook" href="/n3-quartet-ebook.html" style="--card-accent:#2dd4bf"><div class="lh-card-top"><span class="lh-resource-icon"><i class="fa-solid fa-book-open-reader"></i></span><span class="lh-card-status" id="quartetEbookStatus">পৃষ্ঠা 1/135 · 1%</span></div><span class="lh-card-kicker">E-BOOK · QUARTET I</span><h3>QUARTET I বাংলা Interactive eBook</h3><p>ফুরিগানা, বাংলা ব্যাখ্যা, ১৩৫ reader page, menu, search, bookmark, page jump ও saved progress—N3 study companion।</p><div class="lh-card-tags"><span>135 Pages</span><span>Furigana</span><span>বাংলা</span></div><span class="lh-card-action" id="quartetEbookAction">eBook খুলুন <i class="fa-solid fa-arrow-right"></i></span></a>'''
              s = s[:end] + card + s[end:]

          if 'id="quartet-ebook-progress-sync"' not in s:
              script = '''
  <script id="quartet-ebook-progress-sync">
  (function(){
    function syncQuartetEbook(){
      try{
        var status=document.getElementById('quartetEbookStatus');
        var action=document.getElementById('quartetEbookAction');
        if(!status)return;
        var saved=Number(localStorage.getItem('quartetPage')||0);
        var page=Math.max(1,Math.min(135,saved+1));
        var pct=Math.round(page/135*100);
        status.textContent='পৃষ্ঠা '+page+'/135 · '+pct+'%';
        if(action&&page>1)action.innerHTML='পড়া চালিয়ে যান <i class="fa-solid fa-arrow-right"></i>';
      }catch(_){ }
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',syncQuartetEbook,{once:true});else syncQuartetEbook();
    setTimeout(syncQuartetEbook,300);
    window.addEventListener('storage',function(e){if(e.key==='quartetPage')syncQuartetEbook();});
  })();
  </script>
'''
              s = s.replace('</body>', script + '</body>', 1)

          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Persist native Bangla normalization
        run: |
          if git diff --quiet; then
            echo "Native Bangla defaults already normalized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Keep N3 QUARTET eBook integration and Bangla defaults"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Build verified site
        run: npm run verify

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --keep-vars

      - name: Verify live localization
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/check_live_translation.mjs
