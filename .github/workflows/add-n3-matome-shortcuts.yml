name: Add N3 Matome shortcuts

on:
  push:
    branches:
      - feat/n3-matome-shortcuts-20260910
    paths:
      - .github/n3-shortcuts-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/n3-matome-shortcuts-20260910
      - name: Add N3 section shortcuts
        shell: python
        run: |
          from pathlib import Path
          p=Path('n3-matome-grammar.html')
          text=p.read_text(encoding='utf-8')
          marker='  <div class="control-shell">\n    <div class="controls" aria-label="Grammar filter">'
          nav='''  <div class="control-shell">\n    <nav class="n3-section-nav" aria-label="N3 section shortcuts">\n      <a class="n3-section-link" href="/n3-vocabulary"><span class="n3-section-icon">語</span><span><b>N3 Vocabulary</b><small>শব্দভাণ্ডার</small></span></a>\n      <a class="n3-section-link" href="/n3-kanji"><span class="n3-section-icon">漢</span><span><b>N3 Kanji</b><small>কানজি</small></span></a>\n      <a class="n3-section-link" href="/n3-grammar"><span class="n3-section-icon">文</span><span><b>TRY! N3</b><small>ব্যাকরণ</small></span></a>\n    </nav>\n    <div class="controls" aria-label="Grammar filter">'''
          if marker not in text:
              raise SystemExit('control-shell marker not found')
          text=text.replace(marker,nav,1)
          style='''\n  <style>\n    .n3-section-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:0 0 10px;padding:10px;border:1px solid rgba(226,220,245,.9);border-radius:18px;background:rgba(255,255,255,.94);box-shadow:0 12px 32px rgba(48,31,92,.08);backdrop-filter:blur(16px)}\n    .n3-section-link{display:flex;align-items:center;justify-content:center;gap:9px;min-height:58px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;transition:.18s ease}\n    .n3-section-link:hover,.n3-section-link:focus-visible{transform:translateY(-1px);border-color:#a88de5;box-shadow:0 8px 20px rgba(48,31,92,.08);outline:none}\n    .n3-section-icon{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;border-radius:11px;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple-2));font-weight:900}\n    .n3-section-link>span:last-child{min-width:0;display:grid;line-height:1.25}.n3-section-link b{font-size:.82rem;white-space:nowrap}.n3-section-link small{margin-top:3px;color:var(--muted);font-size:.68rem;font-weight:750}\n    body[data-theme="dark"] .n3-section-nav{background:rgba(18,17,31,.94);border-color:#39334e}body[data-theme="dark"] .n3-section-link{background:#1d1a2d;border-color:#3a3450;color:#fff}body[data-theme="dark"] .n3-section-link small{color:#aaa4bc}\n    @media(max-width:560px){.n3-section-nav{gap:7px;padding:8px}.n3-section-link{min-height:56px;gap:6px;padding:7px 5px}.n3-section-icon{flex-basis:30px;width:30px;height:30px;border-radius:9px;font-size:.9rem}.n3-section-link b{font-size:.72rem}.n3-section-link small{font-size:.62rem}}\n  </style>\n'''
          head_marker='</head>'
          text=text.replace(head_marker,style+head_marker,1)
          p.write_text(text,encoding='utf-8')
      - name: Commit shortcut UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add n3-matome-grammar.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add N3 vocabulary kanji and TRY shortcuts"
          git push origin HEAD:feat/n3-matome-shortcuts-20260910
