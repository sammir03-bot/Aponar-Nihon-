name: Fix home auth menu

on:
  push:
    paths:
      - '.github/workflows/fix-home-auth-nav-20260817.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable auth-aware home menu
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          script = '<script defer src="/home-auth-menu.js?v=20260914.1"></script>'

          if script not in s:
              marker = '<script defer src="/assets/js/app-shell.js?v=20260831.3"></script>'
              if marker in s:
                  s = s.replace(marker, script + '\n  ' + marker, 1)
              else:
                  s = s.replace('</body>', '  ' + script + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show menu button after login on home"
          git push
