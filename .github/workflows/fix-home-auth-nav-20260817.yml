name: Fix home auth menu
# Keep this workflow as the deployment-safe repair for both current and legacy home shells.

on:
  push:
    paths:
      - '.github/workflows/fix-home-auth-nav-20260817.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable auth-aware home menu everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          script = '<script defer src="/home-auth-menu.js?v=20260914.2"></script>'
          old_script = re.compile(r'<script defer src="/home-auth-menu\.js\?v=[^"]+"></script>')

          for filename in ('index.html', 'archive/home-full-legacy.html'):
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              s = old_script.sub(script, s)
              if script not in s:
                  s = s.replace('</body>', '  ' + script + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')

          sw = Path('sw-base-v27.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace('aponar-nihon-static-v35', 'aponar-nihon-static-v36')
          w = w.replace('aponar-nihon-dynamic-v35', 'aponar-nihon-dynamic-v36')
          if '"/home-auth-menu.js"' not in w:
              anchor = '  "/account-widget.js",\n'
              if anchor in w:
                  w = w.replace(anchor, anchor + '  "/home-auth-menu.js",\n', 1)
          sw.write_text(w, encoding='utf-8')

          wrapper = Path('sw.js')
          x = wrapper.read_text(encoding='utf-8')
          x = x.replace('app shell v35', 'app shell v36')
          wrapper.write_text(x, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/home-full-legacy.html sw-base-v27.js sw.js
          git commit -m "Fix logged-in header menu button"
          git push
