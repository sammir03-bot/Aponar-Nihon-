name: Aponar Nihon APKPure Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/native-android-apkpure-release.yml'

permissions:
  contents: read

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    env:
      EXPECTED_APKPURE_CERT_SHA256: 95b702984f1a22ed06cf465ffab5ae7b63034c91fc4b6090baf07eec79b4c720
      APKPURE_RELEASE_KEYSTORE_B64: ${{ secrets.APKPURE_RELEASE_KEYSTORE_B64 }}
      APKPURE_RELEASE_STORE_PASSWORD: ${{ secrets.APKPURE_RELEASE_STORE_PASSWORD }}
      APKPURE_RELEASE_KEY_PASSWORD: ${{ secrets.APKPURE_RELEASE_KEY_PASSWORD }}
      APKPURE_RELEASE_KEY_ALIAS: ${{ secrets.APKPURE_RELEASE_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo doctor
        run: npm run doctor

      - name: Read release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app.json').expo.version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          PACKAGE_NAME="$(node -p "require('./app.json').expo.android.package")"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          test "$PACKAGE_NAME" = "com.aponarnihon.app"
          printf 'RELEASE_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'RELEASE_VERSION_CODE=%s\n' "$VERSION_CODE" >> "$GITHUB_ENV"
          printf 'RELEASE_PACKAGE=%s\n' "$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "Building $PACKAGE_NAME version $VERSION (versionCode $VERSION_CODE)"

      - name: Generate Android native project
        run: npm run prebuild:android -- --no-install

      - name: Build optimized release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Restore permanent APKPure signing identity
        shell: bash
        run: |
          set -euo pipefail
          : "${APKPURE_RELEASE_KEYSTORE_B64:?Missing APKPURE_RELEASE_KEYSTORE_B64 repository secret}"
          : "${APKPURE_RELEASE_STORE_PASSWORD:?Missing APKPURE_RELEASE_STORE_PASSWORD repository secret}"
          : "${APKPURE_RELEASE_KEY_PASSWORD:?Missing APKPURE_RELEASE_KEY_PASSWORD repository secret}"
          APKPURE_RELEASE_KEY_ALIAS="${APKPURE_RELEASE_KEY_ALIAS:-aponarnihon}"
          printf 'APKPURE_RELEASE_KEY_ALIAS=%s\n' "$APKPURE_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          mkdir -p dist/signing-private
          printf '%s' "$APKPURE_RELEASE_KEYSTORE_B64" | base64 --decode > dist/signing-private/Aponar-Nihon-release-key.jks
          chmod 600 dist/signing-private/Aponar-Nihon-release-key.jks

          ACTUAL_SHA256="$(keytool -list -v \
            -keystore dist/signing-private/Aponar-Nihon-release-key.jks \
            -alias "$APKPURE_RELEASE_KEY_ALIAS" \
            -storepass "$APKPURE_RELEASE_STORE_PASSWORD" \
            2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_APKPURE_CERT_SHA256" ]; then
            echo 'ERROR: Signing certificate does not match the permanent APKPure release identity.' >&2
            echo "Expected SHA-256: $EXPECTED_APKPURE_CERT_SHA256" >&2
            echo "Actual SHA-256:   ${ACTUAL_SHA256:-unavailable}" >&2
            exit 1
          fi
          echo 'Permanent APKPure signing certificate verified.'

      - name: Zip-align, sign, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$UNSIGNED_APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          mkdir -p dist

          ALIGNED_APK="dist/Aponar-Nihon-v${RELEASE_VERSION}-APKPure-aligned.apk"
          FINAL_APK="dist/Aponar-Nihon-v${RELEASE_VERSION}-APKPure.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks dist/signing-private/Aponar-Nihon-release-key.jks \
            --ks-key-alias "$APKPURE_RELEASE_KEY_ALIAS" \
            --ks-pass env:APKPURE_RELEASE_STORE_PASSWORD \
            --key-pass env:APKPURE_RELEASE_KEY_PASSWORD \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK" | tee dist/signature-verification.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL_APK" >/dev/null

          CERT_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' dist/signature-verification.txt | tr '[:upper:]' '[:lower:]')"
          if [ "$CERT_SHA256" != "$EXPECTED_APKPURE_CERT_SHA256" ]; then
            echo 'ERROR: Final APK signature fingerprint mismatch.' >&2
            echo "Expected SHA-256: $EXPECTED_APKPURE_CERT_SHA256" >&2
            echo "Actual SHA-256:   ${CERT_SHA256:-unavailable}" >&2
            exit 1
          fi

          sha256sum "$FINAL_APK" > "${FINAL_APK}.sha256"
          rm -f "$ALIGNED_APK"
          rm -rf dist/signing-private

      - name: Upload APKPure release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Aponar-Nihon-APKPure-v${{ env.RELEASE_VERSION }}
          path: |
            mobile/dist/Aponar-Nihon-v${{ env.RELEASE_VERSION }}-APKPure.apk
            mobile/dist/Aponar-Nihon-v${{ env.RELEASE_VERSION }}-APKPure.apk.sha256
            mobile/dist/signature-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
