                [{"t":"近視","r":"きんし"}, "の", {"t":"研究","r":"けんきゅう"}, "では、6", {"t":"歳","r":"さい"}, "から35", {"t":"歳","r":"さい"}, "までの", {"t":"約","r":"やく"}, "452", {"t":"万人","r":"まんにん"}, "の", {"t":"匿名","r":"とくめい"}, "データを", {"t":"分析","r":"ぶんせき"}, "しました。"],
