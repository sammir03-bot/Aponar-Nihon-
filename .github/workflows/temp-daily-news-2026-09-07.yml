                {"word":"乱視","reading":"らんし","meaning_bn":"অ্যাস্টিগম্যাটিজম"},
                {"word":"大規模","reading":"だいきぼ","meaning_bn":"বৃহৎ পরিসরের"},
                {"word":"匿名","reading":"とくめい","meaning_bn":"বেনামী"},
                {"word":"分析","reading":"ぶんせき","meaning_bn":"বিশ্লেষণ"},
                {"word":"論文","reading":"ろんぶん","meaning_bn":"গবেষণাপত্র"},
                {"word":"掲載","reading":"けいさい","meaning_bn":"প্রকাশ / ছাপা হওয়া"}
              ],
              "source": {"name":"株式会社ジンズホールディングス（PR TIMES）","url":"https://prtimes.jp/main/html/rd/p/000000399.000027384.html","published_at":"2026-09-03T14:00:00+09:00"}
            },
            {
              "id": "2026-09-07-special-advisor-australia-new-caledonia",
              "date": today,
              "level": "N3",
              "category_bn": "জাপান ও বিশ্ব",
              "headline": "首相特別顧問、豪州とニューカレドニアを訪問へ",
              "headline_tokens": [{"t":"首相特別顧問","r":"しゅしょうとくべつこもん"}, "、", {"t":"豪州","r":"ごうしゅう"}, "とニューカレドニアを", {"t":"訪問","r":"ほうもん"}, "へ"],
              "teaser_bn": "জাপানের প্রধানমন্ত্রীর বিশেষ উপদেষ্টা ৭–১২ সেপ্টেম্বর অস্ট্রেলিয়া ও ফরাসি নিউ ক্যালেডোনিয়া সফর করবেন এবং দ্বিপাক্ষিক সম্পর্ক ও আঞ্চলিক পরিস্থিতি নিয়ে মতবিনিময় করবেন।",
              "japanese": [
                [{"t":"首相特別顧問","r":"しゅしょうとくべつこもん"}, "は、7", {"t":"日","r":"にち"}, "から12", {"t":"日","r":"にち"}, "までオーストラリアとフランス", {"t":"領","r":"りょう"}, "ニューカレドニアを", {"t":"訪問","r":"ほうもん"}, "する", {"t":"予定","r":"よてい"}, "です。"],
                [{"t":"現地","r":"げんち"}, "では", {"t":"政府","r":"せいふ"}, "や", {"t":"軍","r":"ぐん"}, "の", {"t":"関係者","r":"かんけいしゃ"}, "などと", {"t":"会","r":"あ"}, "い、", {"t":"二国間関係","r":"にこくかんかんけい"}, "や", {"t":"地域","r":"ちいき"}, "の", {"t":"情勢","r":"じょうせい"}, "について", {"t":"意見","r":"いけん"}, "を", {"t":"交換","r":"こうかん"}, "します。"],
                [{"t":"外務省","r":"がいむしょう"}, "は、この", {"t":"訪問","r":"ほうもん"}, "を", {"t":"通","r":"つう"}, "じて", {"t":"関係国","r":"かんけいこく"}, "との", {"t":"連携","r":"れんけい"}, "を", {"t":"深","r":"ふか"}, "める", {"t":"考","r":"かんが"}, "えです。"]
              ],
              "explanation_bn": [
                "জাপানের পররাষ্ট্র মন্ত্রণালয় জানিয়েছে, প্রধানমন্ত্রীর বিশেষ উপদেষ্টা ৭ থেকে ১২ সেপ্টেম্বর পর্যন্ত অস্ট্রেলিয়া ও ফরাসি নিউ ক্যালেডোনিয়া সফর করবেন। অর্থাৎ সফরটি আজ থেকেই শুরু হওয়ার কথা।",
                "সেখানে তিনি সরকার ও সামরিক বাহিনীর প্রতিনিধিসহ সংশ্লিষ্ট ব্যক্তিদের সঙ্গে দ্বিপাক্ষিক সম্পর্ক এবং আঞ্চলিক পরিস্থিতি নিয়ে মতবিনিময় করবেন। এটি ইন্দো-প্যাসিফিক অঞ্চলে জাপানের কূটনৈতিক যোগাযোগের একটি উদাহরণ।",
                "শিক্ষার্থীদের জন্য 首相特別顧問, 訪問, 現地, 関係者, 二国間関係, 情勢, 意見交換, 連携—এগুলো N3 পর্যায়ের সংবাদ ও কূটনৈতিক জাপানিতে খুব দরকারি।"
              ],
              "vocabulary": [
                {"word":"首相特別顧問","reading":"しゅしょうとくべつこもん","meaning_bn":"প্রধানমন্ত্রীর বিশেষ উপদেষ্টা"},
                {"word":"豪州","reading":"ごうしゅう","meaning_bn":"অস্ট্রেলিয়া"},
                {"word":"訪問","reading":"ほうもん","meaning_bn":"সফর / পরিদর্শন"},
                {"word":"関係者","reading":"かんけいしゃ","meaning_bn":"সংশ্লিষ্ট ব্যক্তি / প্রতিনিধি"},
                {"word":"二国間関係","reading":"にこくかんかんけい","meaning_bn":"দ্বিপাক্ষিক সম্পর্ক"},
                {"word":"情勢","reading":"じょうせい","meaning_bn":"পরিস্থিতি / অবস্থা"},
                {"word":"意見交換","reading":"いけんこうかん","meaning_bn":"মতবিনিময়"},
                {"word":"連携","reading":"れんけい","meaning_bn":"সমন্বয় / সহযোগিতা"}
              ],
              "source": {"name":"外務省（Ministry of Foreign Affairs of Japan）","url":"https://www.mofa.go.jp/a_o/ocn/au/pageite_000001_01805.html","published_at":"2026-09-04"}
            }
          ]

          articles = data.get('articles')
          if not isinstance(articles, list):
              raise SystemExit('articles must be an array')

          existing_today = [a for a in articles if a.get('date') == today]
          if existing_today:
              if len(existing_today) == 3 and all(a.get('id') for a in existing_today):
                  print('Today already has 3 entries; leaving them unchanged.')
              else:
                  raise SystemExit('Partial or incomplete entries already exist for today; refusing to duplicate them.')
          else:
              old_ids = {a.get('id') for a in articles}
              old_urls = {a.get('source', {}).get('url') for a in articles if isinstance(a, dict)}
              for article in new_articles:
                  if article['id'] in old_ids:
                      raise SystemExit(f"Duplicate id: {article['id']}")
                  if article['source']['url'] in old_urls:
                      raise SystemExit(f"Duplicate source URL: {article['source']['url']}")
              data['articles'] = new_articles + articles
              data['updated_at'] = '2026-09-07T08:45:00+09:00'

          required = {'id','date','level','category_bn','headline','headline_tokens','teaser_bn','japanese','explanation_bn','vocabulary','source'}
          seen_ids = set()
          for idx, article in enumerate(data['articles']):
              missing = required - set(article)
              if missing:
                  raise SystemExit(f'Article {idx} missing keys: {sorted(missing)}')
              if article['id'] in seen_ids:
                  raise SystemExit(f"Duplicate article id: {article['id']}")
              seen_ids.add(article['id'])
              if article['level'] not in {'N4','N3'}:
                  raise SystemExit(f"Unexpected level in {article['id']}: {article['level']}")
              if not isinstance(article['headline_tokens'], list) or not article['headline_tokens']:
                  raise SystemExit(f"Bad headline_tokens: {article['id']}")
              if not isinstance(article['japanese'], list) or not article['japanese']:
                  raise SystemExit(f"Bad japanese content: {article['id']}")
              if not isinstance(article['explanation_bn'], list) or not article['explanation_bn']:
                  raise SystemExit(f"Bad Bengali explanation: {article['id']}")
              if not isinstance(article['vocabulary'], list) or not article['vocabulary']:
                  raise SystemExit(f"Bad vocabulary: {article['id']}")
              source = article['source']
              if not all(source.get(k) for k in ('name','url','published_at')):
                  raise SystemExit(f"Bad source metadata: {article['id']}")
              for token_list in [article['headline_tokens'], *article['japanese']]:
                  if not isinstance(token_list, list):
                      raise SystemExit(f"Token row is not a list: {article['id']}")
                  for token in token_list:
                      if isinstance(token, dict):
                          if set(token) != {'t','r'} or not token['t'] or not token['r']:
                              raise SystemExit(f"Invalid furigana token in {article['id']}: {token}")
                      elif not isinstance(token, (str, int, float)):
                          raise SystemExit(f"Invalid token type in {article['id']}")

          latest_dates = [a['date'] for a in data['articles'][:3]]
          if latest_dates != [today, today, today]:
              raise SystemExit(f'Latest 3 articles are not today: {latest_dates}')

          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          json.loads(path.read_text(encoding='utf-8'))
          print(f"Validated {len(data['articles'])} articles; today's count: {sum(a['date']==today for a in data['articles'])}")
          PY
      - name: Remove temporary workflow and commit Daily News
        shell: bash
        run: |
          rm -f .github/workflows/temp-daily-news-2026-09-07.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/daily-news.json .github/workflows/temp-daily-news-2026-09-07.yml
          if git diff --cached --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git commit -m "Update Daily Japanese News for 2026-09-07"
          git push origin HEAD:automation/daily-news-2026-09-07
