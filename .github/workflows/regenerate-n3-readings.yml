name: Regenerate N3 readings

on:
  push:
    branches:
      - fix/n3-all-example-readings-20260910
    paths:
      - .github/n3-readings-trigger

permissions:
  contents: write

jobs:
  build-readings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n3-all-example-readings-20260910
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Japanese tokenizer
        run: pip install sudachipy==0.6.11 sudachidict_core==20260723
      - name: Regenerate every Matome example reading
        run: python tools/build_matome_readings.py
      - name: Bump readings cache key
        shell: python
        run: |
          from pathlib import Path
          p=Path('n3-matome-grammar.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'/assets/js/n3-matome-readings\.js\?v=[^"\']+', '/assets/js/n3-matome-readings.js?v=20260910.3', s)
          p.write_text(s,encoding='utf-8')
      - name: Commit generated readings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/n3-matome-readings.js n3-matome-grammar.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: regenerate furigana for all N3 examples"
          git push origin HEAD:fix/n3-all-example-readings-20260910
