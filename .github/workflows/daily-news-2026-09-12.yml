name: Daily News One-shot 2026-09-12

on:
  push:
    branches:
      - news/2026-09-12

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Run daily news updater 2026-09-12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: news/2026-09-12
          fetch-depth: 0

      - name: Patch and validate Daily News JSON
        run: |
          python - <<'PY'
          import json, pathlib, sys

          news_path = pathlib.Path('assets/data/daily-news.json')
          payload_path = pathlib.Path('.github/tmp/daily-news-2026-09-12.payload.json')
          workflow_path = pathlib.Path('.github/workflows/daily-news-2026-09-12.yml')

          data = json.loads(news_path.read_text(encoding='utf-8'))
          payload = json.loads(payload_path.read_text(encoding='utf-8'))

          if not isinstance(data, dict) or not isinstance(data.get('articles'), list):
              raise SystemExit('daily-news.json schema error: top-level articles array missing')

          required = {'id','date','level','category_bn','headline','headline_tokens','teaser_bn','japanese','explanation_bn','vocabulary','source'}
          source_required = {'name','url','published_at'}

          def validate_article(a):
              missing = required - set(a)
              if missing:
                  raise ValueError(f"{a.get('id','<no-id>')}: missing {sorted(missing)}")
              if a['level'] not in {'N4','N3'}:
                  raise ValueError(f"{a['id']}: unsupported level")
              if not isinstance(a['headline_tokens'], list) or not a['headline_tokens']:
                  raise ValueError(f"{a['id']}: invalid headline_tokens")
              if not isinstance(a['japanese'], list) or not a['japanese']:
                  raise ValueError(f"{a['id']}: invalid japanese")
              if not isinstance(a['explanation_bn'], list) or not a['explanation_bn']:
                  raise ValueError(f"{a['id']}: invalid explanation_bn")
              if not isinstance(a['vocabulary'], list) or not a['vocabulary']:
                  raise ValueError(f"{a['id']}: invalid vocabulary")
              if not source_required <= set(a['source']):
                  raise ValueError(f"{a['id']}: invalid source")
              for seq in [a['headline_tokens'], *a['japanese']]:
                  if not isinstance(seq, list):
                      raise ValueError(f"{a['id']}: token sequence must be list")
                  for tok in seq:
                      if isinstance(tok, str) or isinstance(tok, (int,float)):
                          continue
                      if not isinstance(tok, dict) or not isinstance(tok.get('t'), str) or not isinstance(tok.get('r'), str) or not tok['r']:
                          raise ValueError(f"{a['id']}: malformed furigana token {tok!r}")
              for v in a['vocabulary']:
                  if not {'word','reading','meaning_bn'} <= set(v):
                      raise ValueError(f"{a['id']}: malformed vocabulary")

          for a in data['articles']:
              validate_article(a)
          for a in payload['articles']:
              validate_article(a)

          ids = {a['id'] for a in data['articles']}
          headlines = {a['headline'] for a in data['articles']}
          additions = []
          for a in payload['articles']:
              if a['id'] in ids or a['headline'] in headlines:
                  continue
              additions.append(a)
              ids.add(a['id'])
              headlines.add(a['headline'])

          if additions:
              data['articles'] = additions + data['articles']
              data['updated_at'] = payload['updated_at']

          # Validate duplicate IDs and today's set after merge.
          all_ids = [a['id'] for a in data['articles']]
          if len(all_ids) != len(set(all_ids)):
              raise ValueError('duplicate article id detected')
          todays = [a for a in data['articles'] if a.get('date') == '2026-09-12']
          if len(todays) != 3:
              raise ValueError(f'expected 3 complete articles for 2026-09-12, found {len(todays)}')
          for a in todays:
              validate_article(a)

          # Ensure archive was preserved: everything present before is still present.
          old_ids = {a['id'] for a in json.loads(news_path.read_text(encoding='utf-8'))['articles']}
          new_ids = {a['id'] for a in data['articles']}
          if not old_ids <= new_ids:
              raise ValueError('archive preservation check failed')

          news_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',',':')), encoding='utf-8')
          # Final parse validates JSON syntax.
          json.loads(news_path.read_text(encoding='utf-8'))

          # Remove one-shot helper files so PR diff contains only daily-news.json.
          payload_path.unlink(missing_ok=True)
          workflow_path.unlink(missing_ok=True)
          print(f'Added {len(additions)} articles; total={len(data["articles"])}')
          PY

      - name: Commit updated news file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update Daily Japanese News for 2026-09-12"
          git push origin HEAD:news/2026-09-12
