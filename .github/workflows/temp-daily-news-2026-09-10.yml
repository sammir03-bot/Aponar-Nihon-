name: Temp Daily News 2026-09-10
on:
  push:
    branches: ["news/2026-09-10"]
permissions:
  contents: write
jobs:
  update-news:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: news/2026-09-10
      - name: Update daily news JSON
        env:
          NEWS_GZ_B64: 
        run: |
          python - <<'PY'
          import base64,gzip,json,os
          from pathlib import Path
          p=Path('assets/data/daily-news.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          incoming=json.loads(gzip.decompress(base64.b64decode(os.environ['NEWS_GZ_B64'])).decode('utf-8'))
          ids={a.get('id') for a in data.get('articles',[])}
          add=[a for a in incoming if a['id'] not in ids]
          if not add:
              print('No new entries needed')
              raise SystemExit(0)
          data['articles']=add+data.get('articles',[])
          data['updated_at']='2026-09-10T08:55:00+09:00'
          required={'id','date','level','category_bn','headline','headline_tokens','teaser_bn','japanese','explanation_bn','vocabulary','source'}
          assert all(required <= set(a) for a in data['articles'])
          assert len({a['id'] for a in data['articles']}) == len(data['articles'])
          for a in add:
              assert a['date']=='2026-09-10' and a['level'] in {'N4','N3'}
              assert a['source'].get('name') and a['source'].get('url') and a['source'].get('published_at')
              assert isinstance(a['headline_tokens'],list) and a['headline_tokens']
              assert isinstance(a['japanese'],list) and len(a['japanese'])>=2
              assert isinstance(a['explanation_bn'],list) and a['explanation_bn']
              assert isinstance(a['vocabulary'],list) and a['vocabulary']
          p.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          json.loads(p.read_text(encoding='utf-8'))
          print('Added',len(add),'articles')
          PY
      - name: Commit update
        run: |
          if git diff --quiet -- assets/data/daily-news.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/daily-news.json
          git commit -m "Daily Japanese News 2026-09-10"
          git push origin HEAD:news/2026-09-10
