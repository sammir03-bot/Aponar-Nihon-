name: Fix mobile bottom navigation overlap

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-bottom-nav-20260901.yml'

permissions:
  contents: write

jobs:
  fix-mobile-bottom-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch mobile dock and home labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/css/app-shell.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* 2026-09-01 mobile dock overlap + tool label fix */'

          if marker not in css:
              css += r'''

/* 2026-09-01 mobile dock overlap + tool label fix */
html {
  scroll-padding-bottom: calc(104px + var(--safe-bottom));
}

@media (max-width: 620px) {
  /* Keep the final rows fully scrollable above the fixed app dock. */
  body.app-page {
    padding-bottom: calc(104px + var(--safe-bottom));
  }

  .app-main,
  .hub-main {
    padding-bottom: 54px;
  }

  /* Long home-card labels should wrap instead of becoming "Student Too...". */
  .app-tool b {
    display: -webkit-box;
    min-height: 2.35em;
    overflow: hidden;
    white-space: normal;
    text-overflow: clip;
    line-height: 1.18;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  /* A compact dock that does not visually sit on top of the last content row. */
  .app-dock-wrap {
    padding: 5px 8px calc(5px + var(--safe-bottom));
    background: linear-gradient(
      180deg,
      rgba(243, 247, 251, 0) 0,
      rgba(243, 247, 251, 0.92) 16px,
      rgba(243, 247, 251, 0.985) 100%
    );
  }

  .app-dock {
    min-height: 60px;
    border-radius: 20px;
  }

  .app-dock-link {
    gap: 1px;
    padding: 4px 2px;
    font-size: 0.56rem;
    line-height: 1.15;
  }

  .app-dock-link i {
    width: 32px;
    height: 30px;
    border-radius: 11px;
    font-size: 1.03rem;
  }

  .app-dock-link.active i {
    box-shadow: 0 5px 12px rgba(22, 119, 232, 0.23);
  }
}

@media (max-width: 370px) {
  .app-dock-link {
    font-size: 0.52rem;
  }
}
'''
              css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('/assets/css/app-shell.css?v=20260829', '/assets/css/app-shell.css?v=20260901.1')
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Aponar Nihon Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/app-shell.css index.html
          git diff --cached --quiet || git commit -m "Fix mobile bottom nav overlap and labels"
          git push
