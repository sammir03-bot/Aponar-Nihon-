name: QUARTET Content Quality

on:
  push:
    paths:
      - '*quartet*'
      - 'n3.html'
      - 'n3-grammar.html'
      - 'assets/**/n3-quartet*'
      - 'assets/**/n2-quartet*'
      - 'assets/css/quartet-studio.css'
      - 'assets/css/quartet-one-*.css'
      - 'assets/js/quartet-one-reader.js'
      - 'assets/css/learning-library.css'
      - 'assets/js/learning-library.js'
      - 'assets/images/learning/**'
      - 'tests/quartet*.spec.mjs'
      - 'tools/check_quartet.py'
      - 'tools/build_quartet_two.py'
      - 'tools/compare_visible_content.py'
      - '.github/workflows/add-n3-quartet-ebook.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check QUARTET lessons and preserved source content
        run: python3 tools/check_quartet.py
      - name: Check interactive course script
        run: |
          node --check assets/js/n3-quartet.js
          node --check assets/js/quartet-one-reader.js
      - name: Check study guide navigation script
        run: node --check assets/js/n3-quartet-study.js
      - name: Check library filtering script
        run: node --check assets/js/learning-library.js
      - name: Build learning pages
        run: npm run build
      - name: Install browser test runner
        run: npm install --no-save @playwright/test@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify both QUARTET volumes on mobile and desktop
        run: npx playwright test tests/quartet.spec.mjs tests/quartet-study.spec.mjs tests/quartet-library.spec.mjs tests/quartet-masterclass.spec.mjs
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quartet-browser-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3
