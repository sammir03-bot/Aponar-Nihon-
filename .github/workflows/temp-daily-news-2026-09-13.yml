          from pathlib import Path

          path = Path('assets/data/daily-news.json')
          main = json.loads(path.read_text(encoding='utf-8'))
          previous = json.loads(Path('/tmp/daily-news-2026-09-12.json').read_text(encoding='utf-8'))

          # Preserve the unmerged 2026-09-12 archive entries without bringing across
          # the stale branch history. This keeps the current main branch as the base.
          main_ids = {a['id'] for a in main['articles']}
          yesterday = [a for a in previous['articles'] if a.get('date') == '2026-09-12' and a.get('id') not in main_ids]
          if len(yesterday) != 3:
              raise SystemExit(f'Expected 3 missing 2026-09-12 entries, found {len(yesterday)}')

          today = [
            {
              "id": "2026-09-13-japan-houthi-attacks-navigation",
