name: Temporary Daily News Updater 2026-09-13

on:
  push:
    branches:
      - news/2026-09-13

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate Daily Japanese News
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin news/2026-09-12:refs/remotes/origin/news/2026-09-12
          git show origin/news/2026-09-12:assets/data/daily-news.json > /tmp/daily-news-2026-09-12.json
          python3 - <<'PY'
