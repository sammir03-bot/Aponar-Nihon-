              "japanese": [
                [{"t":"日本政府","r":"にほんせいふ"},"は、イエメンの",{"t":"フーシ派","r":"フーシは"},"による",{"t":"最近","r":"さいきん"},"の",{"t":"攻撃","r":"こうげき"},"を",{"t":"強","r":"つよ"},"く",{"t":"非難","r":"ひなん"},"しました。"],
                [{"t":"民間人","r":"みんかんじん"},"や",{"t":"民間施設","r":"みんかんしせつ"},"への",{"t":"攻撃","r":"こうげき"},"、",{"t":"船","r":"ふね"},"の",{"t":"安全","r":"あんぜん"},"な",{"t":"航行","r":"こうこう"},"を",{"t":"妨","r":"さまた"},"げる",{"t":"行為","r":"こうい"},"は",{"t":"認","r":"みと"},"められないとしています。"],
