              ],
              "teaser_bn": "IAEA-এর ৭০তম General Conference ১৪–১৮ সেপ্টেম্বর ভিয়েনায় হবে। জাপান পারমাণবিক অস্ত্র বিস্তার রোধ, শান্তিপূর্ণ পারমাণবিক ব্যবহার ও IAEA সহযোগিতা নিয়ে বক্তব্য দেবে।",
              "japanese": [
                ["IAEAの",{"t":"第70回総会","r":"だいななじゅっかいそうかい"},"が14",{"t":"日","r":"にち"},"から18",{"t":"日","r":"にち"},"までオーストリアのウィーンで",{"t":"開","r":"ひら"},"かれます。"],
                [{"t":"日本政府","r":"にほんせいふ"},"の",{"t":"代表","r":"だいひょう"},"が",{"t":"出席","r":"しゅっせき"},"し、",{"t":"核不拡散","r":"かくふかくさん"},"や",{"t":"原子力","r":"げんしりょく"},"の",{"t":"平和利用","r":"へいわりよう"},"について",{"t":"説明","r":"せつめい"},"する",{"t":"予定","r":"よてい"},"です。"],
                [{"t":"会議","r":"かいぎ"},"では、IAEAとの",{"t":"協力","r":"きょうりょく"},"や",{"t":"国際的","r":"こくさいてき"},"な",{"t":"課題","r":"かだい"},"について、",{"t":"各国","r":"かっこく"},"と",{"t":"意見交換","r":"いけんこうかん"},"も",{"t":"行","r":"おこな"},"われます。"]
              ],
              "explanation_bn": [
                "জাপানের পররাষ্ট্র মন্ত্রণালয় ১১ সেপ্টেম্বর জানিয়েছে, IAEA-এর ৭০তম General Conference ১৪ থেকে ১৮ সেপ্টেম্বর অস্ট্রিয়ার ভিয়েনায় অনুষ্ঠিত হবে এবং জাপান সরকার প্রতিনিধি পাঠাবে।",
                "জাপানের বক্তব্যে nuclear non-proliferation, পারমাণবিক শক্তির শান্তিপূর্ণ ব্যবহার, আন্তর্জাতিক চ্যালেঞ্জ মোকাবিলা এবং IAEA-এর উদ্যোগে সহায়তার বিষয় থাকবে। পাশাপাশি বিভিন্ন দেশ ও সংস্থার সঙ্গে সহযোগিতা বাড়ানো নিয়ে মতবিনিময় হবে।",
                "শিক্ষার্থীদের জন্য 総会, 代表, 出席, 核不拡散, 平和利用, 協力, 意見交換—সরকারি ও বিজ্ঞানভিত্তিক সংবাদে খুব উপকারী N4/N3 শব্দ।"
              ],
              "vocabulary": [
                {"word":"総会","reading":"そうかい","meaning_bn":"সাধারণ সম্মেলন / General Conference"},
                {"word":"代表","reading":"だいひょう","meaning_bn":"প্রতিনিধি"},
                {"word":"出席","reading":"しゅっせき","meaning_bn":"উপস্থিত হওয়া / অংশ নেওয়া"},
                {"word":"核不拡散","reading":"かくふかくさん","meaning_bn":"পারমাণবিক অস্ত্রের বিস্তার রোধ"},
                {"word":"平和利用","reading":"へいわりよう","meaning_bn":"শান্তিপূর্ণ ব্যবহার"},
                {"word":"協力","reading":"きょうりょく","meaning_bn":"সহযোগিতা"},
                {"word":"意見交換","reading":"いけんこうかん","meaning_bn":"মতবিনিময়"}
              ],
              "source": {
                "name": "外務省（Ministry of Foreign Affairs of Japan）",
                "url": "https://www.mofa.go.jp/press/release/pressite_000001_02647.html",
                "published_at": "2026-09-11"
              }
            },
            {
              "id": "2026-09-13-pisa-2025-japan-results",
              "date": "2026-09-13",
              "level": "N4",
              "category_bn": "শিক্ষা ও সমাজ",
              "headline": "PISA 2025、日本の15歳は3分野でOECD平均を上回る",
              "headline_tokens": [
                "PISA 2025、", {"t":"日本","r":"にほん"}, "の15", {"t":"歳","r":"さい"}, "は3", {"t":"分野","r":"ぶんや"}, "でOECD", {"t":"平均","r":"へいきん"}, "を", {"t":"上回","r":"うわまわ"}, "る"
              ],
              "teaser_bn": "OECD-এর PISA 2025 country note অনুযায়ী, জাপানের ১৫ বছর বয়সী শিক্ষার্থীরা গণিত, পড়া ও বিজ্ঞানে OECD গড়ের চেয়ে বেশি স্কোর করেছে।",
              "japanese": [
                ["OECDの",{"t":"国際学力調査","r":"こくさいがくりょくちょうさ"},"PISA 2025で、",{"t":"日本","r":"にほん"},"の15",{"t":"歳","r":"さい"},"の",{"t":"生徒","r":"せいと"},"は、",{"t":"数学","r":"すうがく"},"・",{"t":"読解力","r":"どっかいりょく"},"・",{"t":"科学","r":"かがく"},"でOECD",{"t":"平均","r":"へいきん"},"を",{"t":"上回","r":"うわまわ"},"りました。"],
                ["PISAは、",{"t":"知識","r":"ちしき"},"を",{"t":"覚","r":"おぼ"},"えているかだけでなく、",{"t":"複雑","r":"ふくざつ"},"な",{"t":"問題","r":"もんだい"},"を",{"t":"考","r":"かんが"},"え、",{"t":"知識","r":"ちしき"},"や",{"t":"技能","r":"ぎのう"},"を",{"t":"使","r":"つか"},"えるかも",{"t":"調","r":"しら"},"べます。"],
                [{"t":"今回","r":"こんかい"},"の",{"t":"調査","r":"ちょうさ"},"には91の",{"t":"国","r":"くに"},"と",{"t":"地域","r":"ちいき"},"から76",{"t":"万人","r":"まんにん"},"以上が",{"t":"参加","r":"さんか"},"しました。"]
              ],
              "explanation_bn": [
                "OECD-এর ৮ সেপ্টেম্বর প্রকাশিত Japan country note অনুযায়ী, PISA 2025-এ জাপানের ১৫ বছর বয়সী শিক্ষার্থীরা mathematics, reading এবং science—তিন ক্ষেত্রেই OECD average-এর ওপরে ছিল।",
                "PISA শুধু মুখস্থ জ্ঞান নয়; জটিল সমস্যা সমাধান, সমালোচনামূলক চিন্তা, যোগাযোগ এবং বাস্তব পরিস্থিতিতে জ্ঞান-দক্ষতা প্রয়োগের ক্ষমতা যাচাই করে। ২০২৫ সালের পরীক্ষায় ৯১টি দেশ ও অর্থনীতি থেকে ৭৬০,০০০-এর বেশি শিক্ষার্থী অংশ নেয়।",
                "ফলাফল শক্তিশালী হলেও OECD country note বলছে ২০২২ থেকে ২০২৫-এর মধ্যে জাপানে সর্বোচ্চ ও সর্বনিম্ন স্কোর করা শিক্ষার্থীদের ব্যবধান গণিত, পড়া ও বিজ্ঞানে বেড়েছে। তাই headline-এর ভালো ফলের পাশাপাশি এই বৈষম্যের দিকটিও গুরুত্বপূর্ণ।"
              ],
              "vocabulary": [
                {"word":"国際学力調査","reading":"こくさいがくりょくちょうさ","meaning_bn":"আন্তর্জাতিক শিক্ষাগত দক্ষতা জরিপ"},
                {"word":"読解力","reading":"どっかいりょく","meaning_bn":"পাঠ বুঝে পড়ার দক্ষতা"},
                {"word":"平均","reading":"へいきん","meaning_bn":"গড়"},
                {"word":"上回る","reading":"うわまわる","meaning_bn":"ছাড়িয়ে যাওয়া / বেশি হওয়া"},
                {"word":"知識","reading":"ちしき","meaning_bn":"জ্ঞান"},
                {"word":"技能","reading":"ぎのう","meaning_bn":"দক্ষতা"},
                {"word":"調査","reading":"ちょうさ","meaning_bn":"জরিপ / সমীক্ষা"}
              ],
              "source": {
                "name": "OECD",
                "url": "https://www.oecd.org/en/publications/pisa-2025-results-volume-i-country-notes_2d4ff9ea-en/japan_cf203dac-en.html",
                "published_at": "2026-09-08"
              }
            }
          ]

          # Do not duplicate if this workflow is re-run.
          combined_ids = {a['id'] for a in main['articles']}
          additions = []
          for article in today + yesterday:
              if article['id'] not in combined_ids:
                  additions.append(article)
                  combined_ids.add(article['id'])

          main['articles'] = additions + main['articles']
          main['updated_at'] = '2026-09-13T08:12:55+09:00'

          required = {'id','date','level','category_bn','headline','headline_tokens','teaser_bn','japanese','explanation_bn','vocabulary','source'}
          ids = []
          headlines = []
          for i, article in enumerate(main.get('articles', [])):
              missing = required - set(article)
              if missing:
                  raise SystemExit(f'article {i} missing fields: {sorted(missing)}')
              if article['level'] not in {'N4','N3'}:
                  raise SystemExit(f"invalid level: {article['id']} -> {article['level']}")
              if not isinstance(article['headline_tokens'], list) or not article['headline_tokens']:
                  raise SystemExit(f"invalid headline_tokens: {article['id']}")
              if not isinstance(article['japanese'], list) or not article['japanese']:
                  raise SystemExit(f"invalid japanese blocks: {article['id']}")
              if not isinstance(article['explanation_bn'], list) or not article['explanation_bn']:
                  raise SystemExit(f"invalid explanation_bn: {article['id']}")
              if not isinstance(article['vocabulary'], list) or not article['vocabulary']:
                  raise SystemExit(f"invalid vocabulary: {article['id']}")
              source = article['source']
              if not isinstance(source, dict) or not source.get('name') or not source.get('url','').startswith('http') or not source.get('published_at'):
                  raise SystemExit(f"invalid source: {article['id']}")
              for block in [article['headline_tokens']] + article['japanese']:
                  for token in block:
                      if isinstance(token, dict):
                          if set(token) != {'t','r'} or not token['t'] or not token['r']:
                              raise SystemExit(f"invalid furigana token in {article['id']}: {token}")
                      elif not isinstance(token, (str, int, float)):
                          raise SystemExit(f"invalid text token in {article['id']}: {token!r}")
              for vocab in article['vocabulary']:
                  if not all(vocab.get(k) for k in ('word','reading','meaning_bn')):
                      raise SystemExit(f"invalid vocabulary item in {article['id']}: {vocab}")
              ids.append(article['id'])
              headlines.append(article['headline'])

          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate article IDs detected')
          if len(headlines) != len(set(headlines)):
              raise SystemExit('duplicate headlines detected')
          if len([a for a in main['articles'] if a['date'] == '2026-09-13']) != 3:
              raise SystemExit('2026-09-13 must contain exactly 3 articles')
          if len([a for a in main['articles'] if a['date'] == '2026-09-12']) != 3:
              raise SystemExit('2026-09-12 archive must contain exactly 3 articles')

          old_ids = {a['id'] for a in json.loads(Path('/tmp/daily-news-2026-09-12.json').read_text(encoding='utf-8'))['articles']}
          final_ids = set(ids)
          if not old_ids.issubset(final_ids):
              raise SystemExit('archive preservation check failed')

          path.write_text(json.dumps(main, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          # Final parse check.
          json.loads(path.read_text(encoding='utf-8'))
          print(f"Validated {len(main['articles'])} articles; 3 current + 3 restored previous-day entries.")
          PY

          # This workflow is temporary and must not appear in the PR diff.
          rm -f .github/workflows/temp-daily-news-2026-09-13.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/daily-news.json .github/workflows/temp-daily-news-2026-09-13.yml
          git commit -m "content: Daily Japanese News 2026-09-13"
          git push origin HEAD:news/2026-09-13
