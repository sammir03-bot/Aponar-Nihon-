name: Translation response canary

on:
  push:
    branches:
      - feat/full-static-i18n
    paths:
      - .github/workflows/i18n-canary.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/full-static-i18n

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Create temporary job credential
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "I18N_JOB_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy temporary translation Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config tools/i18n-worker/wrangler.toml

      - name: Protect temporary Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$I18N_JOB_TOKEN" | npx --yes wrangler@4 secret put I18N_JOB_TOKEN --config tools/i18n-worker/wrangler.toml

      - name: Test dedicated Cloudflare translation model
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["I18N_JOB_TOKEN"]
          url = "https://aponar-nihon-i18n-job.aponar-nihon.workers.dev/single"
          body = json.dumps({
              "text": "পৃষ্ঠা খুঁজে পাওয়া যায়নি | ZXQBRANDZXQ",
              "target_lang": "en",
          }).encode("utf-8")
          request = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "X-I18n-Job-Token": token,
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              payload = json.loads(response.read().decode("utf-8"))
          print(json.dumps(payload, ensure_ascii=False))
          PY

      - name: Delete temporary translation Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 delete --config tools/i18n-worker/wrangler.toml --force
