name: Translation response canary

on:
  push:
    branches:
      - feat/full-static-i18n
    paths:
      - .github/workflows/i18n-canary.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/full-static-i18n

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Create temporary job credential
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "I18N_JOB_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy temporary translation Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config tools/i18n-worker/wrangler.toml

      - name: Protect temporary Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$I18N_JOB_TOKEN" | npx --yes wrangler@4 secret put I18N_JOB_TOKEN --config tools/i18n-worker/wrangler.toml

      - name: Test dedicated Cloudflare translation model
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          token = os.environ["I18N_JOB_TOKEN"]
          base_url = "https://aponar-nihon-i18n-job.aponar-nihon.workers.dev"

          # Allow the workers.dev route and newly-written secret to propagate.
          time.sleep(5)
          health_request = urllib.request.Request(
              f"{base_url}/health",
              headers={"User-Agent": "Aponar-Nihon-i18n-canary/1.0"},
          )
          try:
              with urllib.request.urlopen(health_request, timeout=30) as response:
                  health_body = response.read().decode("utf-8", errors="replace")
                  print(f"health status={response.status} body={health_body}")
          except urllib.error.HTTPError as error:
              health_body = error.read().decode("utf-8", errors="replace")
              print(f"health status={error.code} headers={dict(error.headers)} body={health_body}")
              raise

          body = json.dumps({
              "text": "পৃষ্ঠা খুঁজে পাওয়া যায়নি | ZXQBRANDZXQ",
              "target_lang": "en",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"{base_url}/single",
              data=body,
              method="POST",
              headers={
                  "X-I18n-Job-Token": token,
                  "Content-Type": "application/json",
                  "User-Agent": "Aponar-Nihon-i18n-canary/1.0",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  payload = response.read().decode("utf-8", errors="replace")
                  print(f"translation status={response.status} body={payload}")
          except urllib.error.HTTPError as error:
              payload = error.read().decode("utf-8", errors="replace")
              print(f"translation status={error.code} headers={dict(error.headers)} body={payload}")
              raise
          PY

      - name: Delete temporary translation Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 delete --config tools/i18n-worker/wrangler.toml --force
