name: Translation response canary

on:
  push:
    branches:
      - feat/full-static-i18n
    paths:
      - .github/workflows/i18n-canary.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/full-static-i18n
      - name: Test dedicated Cloudflare translation model
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{account}/ai/run/@cf/meta/m2m100-1.2b"
          )
          body = json.dumps({
              "text": "পৃষ্ঠা খুঁজে পাওয়া যায়নি | ZXQBRANDZXQ",
              "source_lang": "bn",
              "target_lang": "en",
          }).encode("utf-8")
          request = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              payload = json.loads(response.read().decode("utf-8"))
          print(json.dumps(payload, ensure_ascii=False))
          PY
