name: SEO canonical migration

on:
  push:
    branches:
      - seo-canonical-fix-20260827
    paths:
      - .github/workflows/seo-canonical-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: seo-canonical-fix-20260827
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Migrate canonical origin and legacy hosts
        run: python3 tools/migrate_seo_origin.py

      - name: Sanity checks
        run: |
          test ! -f CNAME
          grep -q 'https://app.aponar-nihon.workers.dev/sitemap.xml' robots.txt
          grep -q 'https://app.aponar-nihon.workers.dev/' sitemap.xml
          ! grep -R --include='*.html' --include='*.xml' --include='*.json' --include='*.txt' --include='*.webmanifest' 'https://aponar-nihon.eu.cc' . \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=_site --exclude-dir=tools --exclude-dir=android --exclude-dir=play-store --exclude-dir=node_modules
          git diff --check

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes needed.'
            exit 0
          fi
          git commit -m 'Consolidate SEO canonical signals on Workers origin'
          git push origin HEAD:seo-canonical-fix-20260827
