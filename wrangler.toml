name = "aponar-nihon-web"
main = "workers/api/src/index.ts"
compatibility_date = "2026-08-25"
workers_dev = true

[assets]
directory = "./_site"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[vars]
APP_ORIGIN = "https://aponar-nihon.eu.cc"
API_VERSION = "2026.08"
