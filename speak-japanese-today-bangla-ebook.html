<!doctype html>
<html lang="bn" dir="ltr" data-language-preset="bn" data-source-language="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#237f7a">
<title>Speak Japanese Today — বাংলা স্টাডি ইবুক</title>
<link rel="icon" href="/logo.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#173b5e;font-family:system-ui,-apple-system,"Noto Sans Bengali","Noto Sans JP",sans-serif}.loader{width:min(560px,calc(100% - 36px));text-align:center;padding:36px 24px;border-radius:26px;background:#fff;box-shadow:0 20px 60px rgba(23,59,94,.12)}.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:#237f7a;color:#fff;font-size:30px;font-weight:900}.loader h1{font-size:25px;line-height:1.35;margin:0 0 8px}.loader p{margin:0;color:#718096;font-size:14px}.bar{height:7px;margin:24px auto 10px;border-radius:99px;background:#e9eef4;overflow:hidden}.bar i{display:block;width:34%;height:100%;border-radius:inherit;background:#d69d45;animation:move 1.1s ease-in-out infinite alternate}.status{font-size:12px;color:#6c7a89}.error{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#fff2f1;color:#a63838;font-size:13px}.back{display:inline-block;margin-top:18px;color:#173b5e;font-weight:800;text-decoration:none}@keyframes move{from{transform:translateX(-10%)}to{transform:translateX(205%)}}
</style>



<script id="legacy-origin-redirect">
(function(){
  var h = location.hostname;
  if (h !== "sammir03-bot.github.io" && h !== "aponar-nihon.eu.cc") return;
  var p = location.pathname || "/";
  if (h === "sammir03-bot.github.io") {
    var bases = ["/Aponar-Nihon-", "/Aponar-Nihon"];
    for (var i = 0; i < bases.length; i++) {
      var base = bases[i];
      if (p === base || p === base + "/") { p = "/"; break; }
      if (p.indexOf(base + "/") === 0) { p = p.slice(base.length) || "/"; break; }
    }
  }
  if (p === "/index.html") p = "/";
  else if (p.endsWith("/index.html")) p = p.slice(0, -10);
  else if (p.endsWith(".html")) p = p.slice(0, -5);
  location.replace("https://app.aponar-nihon.workers.dev" + p + location.search + location.hash);
})();
</script>

<link rel="canonical" href="https://app.aponar-nihon.workers.dev/speak-japanese-today-bangla-ebook">
</head>
<body>
<div class="loader">
  <div class="mark">話</div>
  <h1>Speak Japanese Today</h1>
  <p>বাংলা ব্যাখ্যাসহ ইন্টার‌্যাক্টিভ স্টাডি ইবুক প্রস্তুত হচ্ছে…</p>
  <div class="bar"><i></i></div>
  <div class="status" id="status">বইয়ের ডাটা লোড হচ্ছে</div>
  <div class="error" id="error"></div>
  <a class="back" href="ebook-library.html">← E‑Book Library</a>
</div>
<script>
(async()=>{
  const files=['ebook-data/sjt-pack-1.txt','ebook-data/sjt-pack-2.txt','ebook-data/sjt-pack-3.txt'];
  const RAW='https://raw.githubusercontent.com/sammir03-bot/Aponar-Nihon-/main/';
  const status=document.getElementById('status');
  if(!('DecompressionStream' in window)) throw new Error('এই browser-এ eBook decompression support নেই। Chrome/Brave-এর নতুন version ব্যবহার করুন।');

  async function loadText(file){
    const same=new URL(file,location.href).href;
    const urls=[same,RAW+file];
    let last='';
    for(const url of urls){
      try{
        const r=await fetch(url,{cache:'no-store'});
        if(r.ok) return await r.text();
        last='HTTP '+r.status;
      }catch(e){last=e&&e.message?e.message:String(e);}
    }
    throw new Error(`ডাটা ফাইল লোড হয়নি: ${file}${last?' ('+last+')':''}`);
  }

  const parts=[];
  for(let i=0;i<files.length;i++){
    status.textContent=`বইয়ের ডাটা লোড হচ্ছে — ${i+1}/${files.length}`;
    parts.push(await loadText(files[i]));
  }

  status.textContent='বই খোলা হচ্ছে…';

  function decodeChunk(text){
    let s=String(text||'').replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/[^A-Za-z0-9+/=]/g,'').replace(/=/g,'');
    if(!s)return new Uint8Array(0);
    s+='='.repeat((4-(s.length%4))%4);
    const raw=atob(s),out=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
    return out;
  }
  function concatBytes(arrays){const total=arrays.reduce((n,a)=>n+a.length,0),out=new Uint8Array(total);let off=0;for(const a of arrays){out.set(a,off);off+=a.length;}return out;}
  async function gunzip(bytes){const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text();}

  let html='',firstError=null;
  try{html=await gunzip(concatBytes(parts.map(decodeChunk)));}
  catch(e){firstError=e;try{html=await gunzip(decodeChunk(parts.join('')));}catch(e2){throw firstError||e2;}}

  if(!/<html[\s>]/i.test(html)||!/<\/html>/i.test(html))throw new Error('eBook data সম্পূর্ণভাবে decode হয়নি।');
  document.open();document.write(html);document.close();
})().catch(err=>{
  console.error(err);
  document.getElementById('status').textContent='বইটি খোলা যায়নি';
  const box=document.getElementById('error');box.style.display='block';box.textContent='eBook খুলতে সমস্যা হয়েছে: '+(err.message||'Unknown error');
});
</script>
</body>
</html>
