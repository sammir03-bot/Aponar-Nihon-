<!DOCTYPE html>
<html lang="bn" dir="ltr" data-language-preset="bn" data-source-language="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="2;url=/ssw">
  <title>SSW গাইডে নেওয়া হচ্ছে | আপনার নিহোন</title>
  <link rel="canonical" href="https://app.aponar-nihon.workers.dev/ssw">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/ssw-v2.css?v=20260904">
  <script id="legacy-origin-redirect">
  (function(){
    var h=location.hostname;
    if(h!=="sammir03-bot.github.io"&&h!=="aponar-nihon.eu.cc")return;
    var p=location.pathname||"/";
    if(h==="sammir03-bot.github.io"){
      var bases=["/Aponar-Nihon-","/Aponar-Nihon"];
      for(var i=0;i<bases.length;i++){
        var base=bases[i];
        if(p===base||p===base+"/"){p="/";break;}
        if(p.indexOf(base+"/")===0){p=p.slice(base.length)||"/";break;}
      }
    }
    if(p==="/index.html")p="/";else if(p.endsWith("/index.html"))p=p.slice(0,-10);else if(p.endsWith(".html"))p=p.slice(0,-5);
    location.replace("https://app.aponar-nihon.workers.dev"+p+location.search+location.hash);
  })();
  </script>
</head>
<body>
  <main class="redirect-card">
    <span class="badge">SSW v2</span>
    <h1>নতুন SSW গাইডে নেওয়া হচ্ছে…</h1>
    <p>পুরনো আলাদা page এখন একটি আপডেটেড, কম-bug SSW hub-এর অংশ।</p>
    <a class="btn" style="background:#272756;color:#fff" id="continue-link" href="/ssw">এখনই খুলুন</a>
  </main>
  <script>
  (function(){
    var key=(location.pathname.split('/').pop()||'').replace(/\.html$/,'');
    var map={'ssw-overview':'overview','ssw-visa-process':'process','ssw-exam':'exam','ssw-documents':'documents','ssw-interview':'interview','ssw-job':'fields','ssw-salary':'job','ssw-faq':'faq'};
    var target='/ssw'+(map[key]?'#'+map[key]:'');
    var link=document.getElementById('continue-link');if(link)link.href=target;
    setTimeout(function(){location.replace(target);},120);
  })();
  </script>
</body>
</html>
