<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244a7c">
<title>Aponar Nihon — Refresh</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f8fc;color:#173152;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}.card{width:min(420px,100%);padding:34px 24px;border-radius:28px;background:#fff;box-shadow:0 18px 55px rgba(26,58,91,.13);text-align:center}.logo{width:68px;height:68px;object-fit:contain;margin-bottom:14px}.spin{width:42px;height:42px;margin:20px auto;border:4px solid #dce8f3;border-top-color:#1978dc;border-radius:50%;animation:s .75s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{margin:0;font-size:24px}p{margin:10px 0 0;color:#6b7c8e;line-height:1.7}.ok{color:#0f766e;font-weight:800}
</style>

<meta name="robots" content="noindex,nofollow">

<script id="legacy-origin-redirect">
(function(){
  var h = location.hostname;
  if (h !== "sammir03-bot.github.io" && h !== "aponar-nihon.eu.cc") return;
  var p = location.pathname || "/";
  if (h === "sammir03-bot.github.io") {
    var bases = ["/Aponar-Nihon-", "/Aponar-Nihon"];
    for (var i = 0; i < bases.length; i++) {
      var base = bases[i];
      if (p === base || p === base + "/") { p = "/"; break; }
      if (p.indexOf(base + "/") === 0) { p = p.slice(base.length) || "/"; break; }
    }
  }
  location.replace("https://app.aponar-nihon.workers.dev" + p + location.search + location.hash);
})();
</script>
</head>
<body>
<main class="card">
<img class="logo" src="/logo.png" alt="Aponar Nihon">
<h1>Website আপডেট হচ্ছে</h1>
<p id="status">পুরোনো cache পরিষ্কার করা হচ্ছে…</p>
<div class="spin" aria-hidden="true"></div>
<p class="ok">একটু পরেই Home খুলবে</p>
</main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
   status.textContent='পুরোনো Service Worker সরানো হচ্ছে…';
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>r.unregister()));
   }
   status.textContent='পুরোনো cache পরিষ্কার করা হচ্ছে…';
   if('caches' in window){
     const keys=await caches.keys();
     await Promise.all(keys.map(k=>caches.delete(k)));
   }
   try{localStorage.removeItem('aponarNihonSwVersion')}catch(e){}
   status.textContent='নতুন Aponar Nihon চালু হচ্ছে…';
 }catch(e){
   status.textContent='নতুন version চালু হচ্ছে…';
 }
 setTimeout(()=>location.replace('/?fresh=12&t='+Date.now()),700);
})();
</script>
</body>
</html>
